name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "contracts/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "contracts/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitlog
          POSTGRES_PASSWORD: fitlog
          POSTGRES_DB: fitlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitlog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/build/reports/tests/test
