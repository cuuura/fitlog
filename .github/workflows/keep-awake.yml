name: keep-awake

# Render 무료 서버가 15분 무요청 시 잠들지 않도록 5분마다 /health/ready 를 호출한다.
# 주소는 저장소 Variables 의 KEEP_AWAKE_URL(없으면 아래 기본값). 끄려면 Actions → keep-awake → Disable workflow.
# GitHub 스케줄은 몇 분 늦거나 건너뛸 수 있고, 저장소 활동이 60일 없으면 자동으로 꺼진다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://fitlog-server-3wnw.onrender.com' }}
        run: |
          # 잠든 상태면 깨어나는 데 1분 가까이 걸릴 수 있다
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$URL/health/ready" && echo
